[project]
name = "scenic-cs-agent"
version = "0.1.0"
description = "教学用：对照同程景区客服 Agent 架构的个人重写骨架（Mock，不含公司代码）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langfuse>=5.1.0",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenic_cs_agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
