[project]
name = "scenic-cs-agent"
version = "0.1.0"
description = "教学用：对照同程景区客服 Agent 架构的个人重写骨架（Mock，不含公司代码）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenic_cs_agent"]
