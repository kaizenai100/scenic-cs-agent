# ============================================================
# 公共默认配置（所有环境共用）
#
# 加载顺序：先读本文件，再用 project_<env>.yaml 深合并覆盖。
#   - 环境文件里只写“和默认不一样”的项，避免多份文件复制粘贴后漂移。
#   - 当前环境由环境变量 APP_ENV 决定（test / production），见 config/loader.py。
#
# 密钥约定：本仓是公开仓，yaml 里绝不写真实密钥。
#   - 写成 ${VAR} 占位，加载时从环境变量 / .env 取值；
#   - ${VAR:-默认值} 表示没配时用默认值；
#   - 不带默认值且没配 → 启动直接报错（fail fast，别等到调用模型才炸）。
# ============================================================

project_name: scenic-cs-agent

# Langfuse：prompt 管理 + trace
langfuse:
  host: ${LANGFUSE_HOST:-http://localhost:3300}
  public_key: ${LANGFUSE_PUBLIC_KEY}
  secret_key: ${LANGFUSE_SECRET_KEY}
  # trace 打上环境标签，Langfuse 后台能按环境筛，测试流量不会混进生产看板
  environment: test

# Prompt 拉取策略
prompt:
  # 拉 Langfuse 上哪个 label 的版本；test 环境拉 test，生产拉 production
  label: test
  # SDK 本地缓存秒数：越短改完生效越快，越长对 Langfuse 压力越小
  cache_ttl_seconds: 30
  # 拉取超时：超时就走本地兜底文件，不能让 prompt 服务拖垮对话
  fetch_timeout_seconds: 3

# 大模型（步骤 1–7 的适配器仍可读这一段；新代码请走下面的 gateway）
model:
  name: deepseek-chat
  base_url: https://api.deepseek.com
  api_key: ${DEEPSEEK_API_KEY}
  timeout_seconds: 60

# ============================================================
# 进程内 LLM Gateway
#
# 业务 / Agent Loop / examples 只通过 Gateway 调模型：
#   - 代码里拿别名（default / fast），不自己选厂商、不自己重试
#   - 密钥继续只写 ${VAR}，没配就先把 Gateway 建出来，真调用时再失败
#   - 这不是一个单独部署的 HTTP 服务，和调用方在同一个进程里
#
# 路由策略：
#   priority（默认）按 routes 顺序试，前面的失败或熔断打开才用下一条。weight 可写但不生效。
#   weighted_round_robin 按 weight 决定这一次先打谁，失败后仍用其余路由 fallback。
# 未知策略在加载时失败。
# ============================================================
gateway:
  default_alias: default
  # 结构化校验失败后，最多把错误附回去再请求这么多次。0 表示不修复。
  structured_output_retries: 1
  retry:
    # 含第一次。2 = 失败后再试 1 次。
    max_attempts_per_route: 2
    base_delay_seconds: 0.2
    max_delay_seconds: 2
    retryable_codes: ["timeout", "connection", "429", "500", "502", "503", "504"]
  circuit_breaker:
    failure_threshold: 5
    cooldown_seconds: 30
    # 冷却结束后只放 1 个探测，成功才关上，避免积压请求把上游再次打满。
    half_open_max_probes: 1
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10
  # 观测走现有 langfuse 段（host / public_key / secret_key / environment）。
  # 不在这里再配一套地址或密钥。缺密钥时即使 enabled 也不会连出去。
  # 上报的是调用元数据（别名、provider、耗时、token、重试、fallback、ttft、错误码），不含对话正文。
  observe:
    langfuse_enabled: true
  providers:
    deepseek:
      kind: deepseek_chat
      model: deepseek-chat
      base_url: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}
      timeout_seconds: 60
      enabled: true
    # 备路由。默认仍指向同一家，公开仓不必再引入第二套密钥。
    # 熔断按 provider 名分开计数：要换成另一家时，改 kind / base_url / api_key 即可。
    deepseek_backup:
      kind: deepseek_chat
      model: deepseek-chat
      base_url: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}
      timeout_seconds: 60
      enabled: true
  aliases:
    default:
      strategy: priority
      routes:
        - provider: deepseek
          model: deepseek-chat
        - provider: deepseek_backup
          model: deepseek-chat
    fast:
      # 权重轮询示例：deepseek 大约每 4 次里有 3 次先被选中，失败再落到备路由。
      strategy: weighted_round_robin
      routes:
        - provider: deepseek
          model: deepseek-chat
          weight: 3
        - provider: deepseek_backup
          model: deepseek-chat
          weight: 1

# ============================================================
# MCP（Model Context Protocol）
#
# 远端工具先收成普通 Tool，再放进 ToolRuntime。
# 参数校验、场景白名单、审批、超时、审计都走 Runtime，不能绕开。
#
# tools 是允许列表：服务还列出了别的工具也不会注册。
# 只读、超时、审批、场景以这里为准，不采信远端自己标的 readOnlyHint。
# read_only 省略时当成写操作（超时不自动重试）。
# 写操作没写 requires_approval 时，默认要先审批。
#
# 给模型看的名字是「服务名 + name_separator + 工具名」。
# 和已有工具撞名就拒绝这一条，不覆盖。
#
# 密钥仍然只写 ${VAR}。没配或展开后是空的，就不会传给子进程 / 请求头。
# ============================================================
mcp:
  enabled: true
  name_separator: "__"
  servers:
    scenic_ticket:
      enabled: true
      transport: stdio
      # 在仓库根目录用 `uv run` 启动时，PATH 上的 python 就是本项目的解释器。
      command: python
      args:
        - -m
        - scenic_cs_agent.mcp_server
      env:
        SCENIC_MCP_TOKEN: ${SCENIC_MCP_TOKEN:-}
      startup_timeout_seconds: 15
      required: true
      tools:
        query_ticket_order:
          read_only: true
          timeout_seconds: 3
          scenes: [presale, aftersale]
        get_opening_hours:
          read_only: true
          timeout_seconds: 3
          scenes: [presale, aftersale]
    # 默认不连。配好地址后把 enabled 改成 true。令牌走请求头，不写进 url。
    ticket_http:
      enabled: false
      transport: http
      url: ${MCP_HTTP_URL:-http://127.0.0.1:9/mcp}
      headers:
        Authorization: ${MCP_HTTP_TOKEN:-}
      startup_timeout_seconds: 5
      required: false
      tools:
        query_ticket_order:
          read_only: true
          timeout_seconds: 3
