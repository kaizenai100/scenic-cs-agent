# 生产环境：只写和 project.yaml 不同的项
prompt:
  # 线上只认 production label；发布 / 回滚 = 在 Langfuse 上挪这个 label，不改代码
  label: production
  # 生产缓存长一点，减少对 Langfuse 的请求；回滚最多延迟这么多秒生效
  cache_ttl_seconds: 60

langfuse:
  environment: production

# 生产冷却比公共默认更长，避免上游抖动时半开探测太密。阈值和限流沿用 project.yaml。
gateway:
  circuit_breaker:
    cooldown_seconds: 45

# 不拉起仓库里的 mock 进程。要接真实 MCP 服务时再打开，并写上这个环境自己的 servers。
mcp:
  enabled: false
  servers:
    scenic_ticket:
      enabled: false
    ticket_http:
      enabled: false
